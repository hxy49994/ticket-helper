name: Build APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: |
          chmod +x gradlew
          echo "storePassword=123456" > keystore.properties
          echo "keyPassword=123456" >> keystore.properties
          echo "keyAlias=ticket_helper" >> keystore.properties
          echo "storeFile=ticket_helper.jks" >> keystore.properties
          keytool -genkey -v -keystore ticket_helper.jks \
            -alias ticket_helper -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass 123456 -keypass 123456 \
            -dname "CN=TicketHelper, OU=DEV, O=TicketHelper, L=Beijing, ST=Beijing, C=CN"
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          apksigner sign --ks ticket_helper.jks \
            --ks-key-alias ticket_helper \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --out app/build/outputs/apk/release/TicketHelper-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TicketHelper-APK
          path: app/build/outputs/apk/release/TicketHelper-signed.apk
